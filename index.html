
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuralDesk — AI Workspace</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0b0b10;
      color: #f4f4f8;
      height: 100vh;
      display: flex;
    }
    aside {
      width: 250px;
      padding: 24px 16px;
      background: #101017;
      border-right: 1px solid #252530;
    }
    .brand { font-size: 22px; font-weight: 750; margin-bottom: 28px; }
    .brand span { color: #9c83ff; }
    .new-chat {
      width: 100%;
      padding: 12px;
      color: white;
      background: #24222f;
      border: 1px solid #393547;
      border-radius: 10px;
      cursor: pointer;
    }
    .label {
      color: #777789;
      font-size: 11px;
      letter-spacing: 1.5px;
      margin: 30px 8px 12px;
    }
    .history { color: #aaa9bb; font-size: 13px; padding: 10px 8px; }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    header {
      padding: 20px 28px;
      border-bottom: 1px solid #252530;
      color: #c6c4d5;
      font-size: 14px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px;
      width: 100%;
    }
    .welcome { text-align: center; margin: 13vh auto 35px; max-width: 550px; }
    .orb {
      width: 58px; height: 58px; margin: auto auto 22px;
      border-radius: 20px;
      background: linear-gradient(135deg, #a78bfa, #5340b7);
      box-shadow: 0 0 50px #7054db33;
    }
    h1 { font-size: clamp(28px, 4vw, 42px); margin: 0 0 12px; letter-spacing: -1.5px; }
    .subtitle { color: #9392a6; line-height: 1.7; }
    .message { max-width: 760px; margin: 0 auto 24px; line-height: 1.7; white-space: pre-wrap; }
    .user { color: #c8baff; }
    .assistant { color: #e3e1ed; }
    .composer { width: min(760px, calc(100% - 32px)); margin: 0 auto 24px; }
    .input-wrap {
      display: flex; align-items: end; gap: 10px;
      padding: 10px; border: 1px solid #353443;
      background: #15151e; border-radius: 16px;
    }
    textarea {
      flex: 1; resize: none; max-height: 150px; min-height: 42px;
      padding: 11px; border: 0; outline: 0; background: transparent;
      color: white; font: inherit;
    }
    #send {
      border: 0; border-radius: 11px; background: #8c70ed;
      color: white; padding: 12px 16px; cursor: pointer;
    }
    #send:disabled { opacity: .5; cursor: wait; }
    .hint { text-align: center; color: #666577; font-size: 11px; margin-top: 12px; }
    @media(max-width:650px) {
      aside { display:none; }
      header { padding: 17px; }
      #messages { padding: 20px 16px; }
      .welcome { margin-top: 10vh; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">Neural<span>Desk</span></div>
    <button class="new-chat" id="newChat">＋ New conversation</button>
    <div class="label">WORKSPACE</div>
    <div class="history">✦ Your AI assistant</div>
    <div class="history">⌘ Powered by local AI</div>
  </aside>

  <main>
    <header>NeuralDesk <span style="color:#777789">/</span> AI Workspace</header>
    <section id="messages">
      <div class="welcome" id="welcome">
        <div class="orb"></div>
        <h1>Think beyond.</h1>
        <p class="subtitle">Your ideas deserve more than ordinary answers.<br>What would you like to explore today?</p>
      </div>
    </section>

    <form class="composer" id="chatForm">
      <div class="input-wrap">
        <textarea id="prompt" placeholder="Ask NeuralDesk anything..." rows="1" required></textarea>
        <button id="send" type="submit">↑</button>
      </div>
      <div class="hint">NeuralDesk can make mistakes. Verify important information.</div>
    </form>
  </main>

  <script>
    const form = document.getElementById('chatForm');
    const promptInput = document.getElementById('prompt');
    const messages = document.getElementById('messages');
    const send = document.getElementById('send');
    let conversation = [];

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      div.textContent = (role === 'user' ? 'YOU\n' : 'NEURALDESK\n') + text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    document.getElementById('newChat').addEventListener('click', () => {
      conversation = [];
      messages.innerHTML = '';
      const welcome = document.createElement('div');
      welcome.className = 'welcome';
      welcome.id = 'welcome';
      welcome.innerHTML = '<div class="orb"></div><h1>Think beyond.</h1><p class="subtitle">Your ideas deserve more than ordinary answers.<br>What would you like to explore today?</p>';
      messages.appendChild(welcome);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = promptInput.value.trim();
      if (!text || send.disabled) return;

      document.getElementById('welcome')?.remove();
      promptInput.value = '';
      addMessage(text, 'user');
      conversation.push({ role: 'user', content: text });
      send.disabled = true;
      const reply = addMessage('Thinking...', 'assistant');

      try {
        const response = await fetch('http://localhost:11434/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'llama3.2:1b',
            messages: conversation,
            stream: false
          })
        });
        if (!response.ok) throw new Error('Ollama returned HTTP ' + response.status);
        const data = await response.json();
        reply.textContent = 'NEURALDESK\n' + data.message.content;
        conversation.push({ role: 'assistant', content: data.message.content });
      } catch (error) {
        reply.textContent = 'NEURALDESK\nCould not connect to Ollama. Make sure Ollama is running on your computer. Details: ' + error.message;
      } finally {
        send.disabled = false;
        promptInput.focus();
      }
    });

    promptInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
